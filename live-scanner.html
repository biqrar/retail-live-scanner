<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Retail Desk live scanner</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; background:#101722; color:#f7f9fc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:18px; display:grid; place-items:center; }
    main { width:min(100%,560px); }
    h1 { margin:0 0 8px; font-size:24px; }
    p { margin:0 0 16px; color:#c0cad8; }
    #reader { width:100%; overflow:hidden; border-radius:16px; background:#000; }
    #status { min-height:48px; margin-top:16px; padding:12px; border-radius:10px; background:#1d2938; }
    #close { width:100%; margin-top:12px; padding:14px; border:0; border-radius:10px; background:#e7edf5; color:#172033; font-size:16px; font-weight:700; }
    [dir="rtl"] { text-align:right; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Live item scanner</h1>
    <p id="hint">Point the rear camera at one barcode or QR code. The matching item will be returned to your open Sell or Buy form.</p>
    <div id="reader"></div>
    <div id="status" role="status" aria-live="polite">Starting camera…</div>
    <button id="close" type="button">Close scanner</button>
  </main>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const session = params.get('session') || '';
      const returnOrigin = params.get('returnOrigin') || '';
      const language = params.get('lang') || 'en';
      const text = {
        en: {title:'Live item scanner', hint:'Point the rear camera at each barcode or QR code. Every new scan adds a product row to the open Sell or Buy form.', starting:'Starting camera…', ready:'Camera is ready. Center a barcode or QR code in the frame.', found:'Added {code}. Move it away, then scan the next item.', failed:'Could not start the camera. Check camera permission and try again.', invalid:'Open this scanner from the Sell or Buy form.', close:'Close scanner'},
        ps: {title:'ژوندی سکینر', hint:'شا شا کامره هر بارکوډ یا QR کوډ ته ونیسئ. هر نوی سکین د پلور یا پېرود فورم ته د توکي نوې کرښه زیاتوي.', starting:'کامره چالانېږي…', ready:'کامره چمتو ده. کوډ د چوکاټ منځ ته ونیسئ.', found:'{code} ورزیات شو. کوډ لرې کړئ او بل توکی سکین کړئ.', failed:'کامره چالان نه شوه. د کامرې اجازه وګورئ او بیا هڅه وکړئ.', invalid:'دا سکینر د پلور یا پېرود له فورم څخه پرانیزئ.', close:'سکینر بند کړئ'},
        fa: {title:'اسکنر زنده کالا', hint:'کمره پشتی را مقابل هر بارکد یا QR بگیرید. هر اسکن جدید یک ردیف کالا به فورم فروش یا خرید اضافه می‌کند.', starting:'کمره در حال راه‌اندازی…', ready:'کمره آماده است. کد را در مرکز کادر قرار دهید.', found:'{code} اضافه شد. کد را دور کنید و کالای بعدی را اسکن کنید.', failed:'کمره راه‌اندازی نشد. اجازه کمره را بررسی و دوباره تلاش کنید.', invalid:'این اسکنر را از فورم فروش یا خرید باز کنید.', close:'بستن اسکنر'}
      }[language] || null;
      const strings = text || {
        title:'Live item scanner', hint:'Point the rear camera at each barcode or QR code. Every new scan adds a product row to the open Sell or Buy form.', starting:'Starting camera…', ready:'Camera is ready. Center a barcode or QR code in the frame.', found:'Added {code}. Move it away, then scan the next item.', failed:'Could not start the camera. Check camera permission and try again.', invalid:'Open this scanner from the Sell or Buy form.', close:'Close scanner'
      };
      document.documentElement.lang = language === 'ps' ? 'ps-AF' : language === 'fa' ? 'fa-AF' : 'en';
      document.documentElement.dir = language === 'en' ? 'ltr' : 'rtl';
      document.getElementById('title').textContent = strings.title;
      document.getElementById('hint').textContent = strings.hint;
      document.getElementById('status').textContent = strings.starting;
      document.getElementById('close').textContent = strings.close;
      const status = document.getElementById('status');
      let scanner = null;
      let sent = false;
      let awaitingResume = false;
      let lastDetectedCode = '';
      let lastDetectedAt = 0;

      function sendToParent(message) {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(Object.assign({session:session}, message), returnOrigin);
        }
      }

      function closeScanner() {
        sent = true;
        const stop = scanner && scanner.isScanning ? scanner.stop() : Promise.resolve();
        Promise.resolve(stop).catch(function() {}).finally(function() {
          sendToParent({type:'retail-live-stop'});
          window.close();
        });
      }

      document.getElementById('close').addEventListener('click', closeScanner);
      window.addEventListener('message', function(event) {
        const message = event.data || {};
        if (event.source !== window.opener || event.origin !== returnOrigin || message.session !== session) return;
        if (message.type === 'retail-live-stop') {
          closeScanner();
        } else if (message.type === 'retail-live-resume' && scanner && awaitingResume && !sent) {
          awaitingResume = false;
          try { scanner.resume(); } catch (error) {
            status.textContent = strings.failed;
            return;
          }
          status.textContent = strings.ready;
        }
      });
      if (!session || !window.opener || !/^https:\/\//i.test(returnOrigin) || !window.Html5Qrcode) {
        status.textContent = !window.Html5Qrcode ? strings.failed : strings.invalid;
        return;
      }

      const formats = Html5QrcodeSupportedFormats;
      scanner = new Html5Qrcode('reader', {
        formatsToSupport:[formats.QR_CODE, formats.CODE_128, formats.CODE_39, formats.CODE_93,
          formats.EAN_13, formats.EAN_8, formats.UPC_A, formats.UPC_E, formats.ITF, formats.DATA_MATRIX]
      });
      scanner.start({facingMode:'environment'}, {fps:12, qrbox:{width:280, height:180}}, function(decodedText) {
        if (sent) return;
        const code = String(decodedText || '').trim();
        const now = Date.now();
        if (!code || awaitingResume) return;
        if (code === lastDetectedCode) {
          lastDetectedAt = now;
          return;
        }
        lastDetectedCode = code;
        lastDetectedAt = now;
        awaitingResume = true;
        status.textContent = strings.found.replace('{code}', code);
        try { scanner.pause(false); } catch (error) { awaitingResume = false; }
        sendToParent({type:'retail-live-scan', code:code});
      }, function() {}).then(function() {
        if (!sent) status.textContent = strings.ready;
      }).catch(function() {
        status.textContent = strings.failed;
      });

      // Debounce a barcode held in frame, but allow rescanning it once removed.
      const rearmTimer = window.setInterval(function() {
        if (!awaitingResume && lastDetectedCode && Date.now() - lastDetectedAt > 1100) lastDetectedCode = '';
      }, 250);
      window.addEventListener('beforeunload', function() { window.clearInterval(rearmTimer); });
    })();
  </script>
</body>
</html>
